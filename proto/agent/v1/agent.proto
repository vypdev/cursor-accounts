}

message WebSearchRequestResponse { // agent.v1.WebSearchRequestResponse
  WebSearchRequestResponse_Approved approved = 1;
  WebSearchRequestResponse_Rejected rejected = 2;
}

message WebSearchRequestResponse_Approved { // agent.v1.WebSearchRequestResponse.Approved
}

message WebSearchRequestResponse_Rejected { // agent.v1.WebSearchRequestResponse.Rejected
  string reason = 1;
}

message WebSearchResult { // agent.v1.WebSearchResult
