name: Task - Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'
      title:
        description: 'Title'
        required: true
        default: 'New Version'
      changelog:
        description: 'Changelog'
        required: true
        default: '- Several improvements'
      issue:
        description: 'Launcher issue'
        required: true
        default: '-1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Validate inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
          ISSUE: ${{ github.event.inputs.issue }}
          TITLE: ${{ github.event.inputs.title }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          err=0
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in semver format (e.g. 1.0.0)."
            err=1
          fi
          if ! [[ "$ISSUE" =~ ^-?[0-9]+$ ]]; then
            echo "::error::Issue must be a number (e.g. 123 or -1)."
            err=1
          fi
          if [[ ${#TITLE} -gt 1000 ]]; then
            echo "::error::Title must be at most 1000 characters."
            err=1
          fi
          if [[ ${#CHANGELOG} -gt 50000 ]]; then
            echo "::error::Changelog must be at most 50000 characters."
            err=1
          fi
          [[ $err -eq 0 ]] || exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version in package.json
        run: node scripts/bump-version.js "${{ github.event.inputs.version }}"

      - name: Commit and push version bump
        uses: EndBug/add-and-commit@v9
        with:
          add: './package.json'
          committer_name: GitHub Actions
          committer_email: actions@github.com
          default_author: user_info
          message: 'gh-action: bumped version to ${{ github.event.inputs.version }} (release)'
          push: true

      - name: Copilot - Create Tag
        uses: vypdev/copilot@v2
        if: ${{ success() }}
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'create_tag'
          single-action-issue: '${{ github.event.inputs.issue }}'
          single-action-version: '${{ github.event.inputs.version }}'
          token: ${{ secrets.PAT }}

      - name: Copilot - Create Release
        uses: vypdev/copilot@v2
        if: ${{ success() }}
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'create_release'
          single-action-issue: '${{ github.event.inputs.issue }}'
          single-action-version: '${{ github.event.inputs.version }}'
          single-action-title: '${{ github.event.inputs.title }}'
          single-action-changelog: '${{ github.event.inputs.changelog }}'
          token: ${{ secrets.PAT }}

  publish-openvsx:
    name: Publish (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ contains(matrix.os, 'Windows') && 'cmd' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, macOS, ARM64]
            target: darwin-arm64
          - os: [self-hosted, macOS, X64]
            target: darwin-x64
          - os: [self-hosted, Linux, X64]
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: [self-hosted, Windows, X64]
            target: win32-x64
          - os: [self-hosted, Windows, X64]
            target: win32-arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.PAT }}

      - name: Pull latest version bump
        run: git pull --rebase origin "${{ github.ref_name }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bundled binaries
        if: ${{ !contains(matrix.os, 'Windows') }}
        shell: bash
        run: bash scripts/verify-binaries.sh

      - name: Build VSIX
        run: pnpm run build -- --target ${{ matrix.target }}

      - name: Publish to Open VSX Registry
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm dlx ovsx publish "cursor-accounts-${{ matrix.target }}-${VERSION}.vsix" --no-rewrite-relative-links -p "${{ secrets.OVSX_PAT }}"

  notify:
    name: Deploy notification
    needs: publish-openvsx
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - name: Copilot - Deploy success notification
        uses: vypdev/copilot@v2
        with:
          debug: ${{ vars.DEBUG }}
          single-action: 'deployed_action'
          single-action-issue: '${{ github.event.inputs.issue }}'
          opencode-model: ${{ vars.OPENCODE_MODEL }}
          token: ${{ secrets.PAT }}
