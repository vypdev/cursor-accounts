name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  # TODO: remove after validating self-hosted runners
  push:
    branches:
      - develop

jobs:
  validate:
    name: validate (${{ matrix.platform }})
    if: >-
      github.event_name == 'push' ||
      (
        !startsWith(github.event.pull_request.head.ref, 'release/') &&
        !startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            platform: linux-x64
          - os: [self-hosted, macOS, ARM64]
            platform: macos-arm64
          - os: [self-hosted, macOS, X64]
            platform: macos-x64
          - os: [self-hosted, Windows, X64]
            platform: win32-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Validate localization
        run: pnpm run validate:l10n

      - name: Validate shared types sync
        run: pnpm run test:types-sync

      - name: Test extension
        run: pnpm test
