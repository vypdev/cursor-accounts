name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: validate (${{ matrix.platform }})
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            platform: linux-x64
          - os: [self-hosted, macOS, ARM64]
            platform: macos-arm64
          - os: [self-hosted, macOS, X64]
            platform: macos-x64
          - os: [self-hosted, Windows, X64]
            platform: win32-x64
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify toolchain contract
        run: pnpm run verify:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production supply chain
        run: pnpm run audit:supply-chain -- --output .tmp/supply-chain-report.json

      - name: Upload supply-chain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-report-${{ matrix.platform }}-${{ github.run_id }}
          path: .tmp/supply-chain-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: Test architecture checker
        run: pnpm run test:architecture

      - name: Lint
        run: pnpm run lint

      - name: Validate localization
        run: pnpm run validate:l10n

      - name: Validate shared types sync
        run: pnpm run test:types-sync

      - name: Test extension
        run: pnpm test

      - name: Test extension with coverage
        run: pnpm run test:coverage

      - name: Test webview with coverage floors
        run: pnpm --dir webview run test:coverage

      - name: Upload webview coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webview-coverage-${{ matrix.platform }}-${{ github.run_id }}
          path: webview/coverage
          if-no-files-found: warn
          retention-days: 14
