name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Validate localization
        run: pnpm run validate:l10n

      - name: Validate shared types sync
        run: pnpm run test:types-sync

      - name: Test extension
        run: pnpm test

      - name: Test webview
        run: pnpm --dir webview test
